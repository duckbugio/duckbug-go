name: duckbug-go Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # The tag is verified by the same definition pull requests are verified by,
  # including the toolchain matrix. Previously this file carried its own copy,
  # and the copy was weaker.
  checks:
    uses: ./.github/workflows/go-checks.yml

  github-release:
    name: Create GitHub Release
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            go get github.com/duckbugio/duckbug-go@${{ github.ref_name }}
            ```

            This release is published as a standard Go module version.
