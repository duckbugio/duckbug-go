name: duckbug-go Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Run tests
        run: go test -race ./...

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run go vet
        run: go vet ./...

  # Same scan as ci.yml, because a tag runs this file and never that one: the
  # release path had kept the @latest install that had already broken CI.
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Scanned with the current stable toolchain rather than the floor in
      # go.mod: this job answers "are our code and our dependencies vulnerable",
      # which is what a pull request can actually fix. Standard library
      # advisories against the declared floor would redden every run until
      # someone raises the minimum Go version for all consumers; the floor is
      # exercised by the test job instead.
      #
      # The price is that this job is not reproducible from the SHA alone. A new
      # Go release changes the standard library being analysed, and the advisory
      # database is fetched at run time, so the same commit can be green today
      # and red tomorrow. That is the point - an advisory published tomorrow is
      # news - but it means a red run here is not necessarily the fault of the
      # commit that triggered it.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # The scanner version is pinned in .github/tools/go.mod, not written here
      # as @latest: @latest let an x/vuln release that required a newer Go than
      # this job ran on kill the gate at install time. Keeping the pin in a
      # manifest means Dependabot bumps it when it ages; a version string in a
      # workflow file ages silently.
      - name: Install govulncheck
        run: go install -C .github/tools golang.org/x/vuln/cmd/govulncheck

      - name: Run govulncheck
        run: govulncheck ./...

  github-release:
    name: Create GitHub Release
    needs: [verify, security-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Install

            ```bash
            go get github.com/duckbugio/duckbug-go@${{ github.ref_name }}
            ```

            This release is published as a standard Go module version.
