name: duckbug-go CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - "1.25.13"
          - "1.26.1"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Verify formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Verify module metadata
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Scanned with the current stable toolchain rather than the floor in
      # go.mod: this job answers "are our code and our dependencies vulnerable",
      # which is what a pull request can actually fix. Standard library
      # advisories against the declared floor would redden every open PR until
      # someone raises the minimum Go version for all consumers; the test matrix
      # above is what keeps that floor honest.
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      # Pinned on purpose: with @latest any x/vuln release can raise its own Go
      # requirement above the toolchain here, and the gate then dies at install
      # time without scanning anything - that is how this job broke. The
      # vulnerability database is fetched at run time, so a pinned binary still
      # sees new advisories; bump this pin deliberately.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Run govulncheck
        run: govulncheck ./...
